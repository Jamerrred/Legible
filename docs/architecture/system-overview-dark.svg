<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1360 480" role="img" aria-labelledby="title desc">
  <title id="title">Legible at a glance</title>
  <desc id="desc">A business owner works with the Legible harness, which calls Muse Spark and Exa and runs Errand as simulated customers. Legible publishes confirmed facts to a public page on Cloudflare and gets back questions, bookings and agent traces. AI agents like Muse read the business website, follow its one link and use the public page.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#C5C2B8"/>
    </marker>
    <style>
      text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; text-anchor: middle; }
      .name { font-size: 23px; font-weight: 600; }
      .sub { font-size: 18px; }
      .label { font-size: 16px; fill: #C5C2B8; }
      .start { text-anchor: start; }
      .line { fill: none; stroke: #C5C2B8; stroke-width: 1.8; marker-end: url(#arrow); }
      .both { marker-start: url(#arrow); }
      .dash { stroke-dasharray: 6 5; }
    </style>
  </defs>

  <!-- Connections -->
  <path class="line" d="M210 208 H338"/>
  <text x="274" y="174" class="label">website,</text>
  <text x="274" y="196" class="label">answers, updates</text>
  <path class="line both" d="M500 76 V108"/>
  <path class="line both" d="M500 302 V370"/>
  <text x="512" y="342" class="label start">runs tests</text>
  <path class="line" d="M660 150 H818"/>
  <text x="740" y="138" class="label">confirmed facts</text>
  <path class="line" d="M820 215 H662"/>
  <text x="740" y="240" class="label">questions, bookings,</text>
  <text x="740" y="262" class="label">agent traces</text>
  <path class="line" d="M660 395 H800 V285 H818"/>
  <text x="730" y="386" class="label">test after</text>
  <path class="line" d="M660 430 H818"/>
  <text x="740" y="420" class="label">test before</text>
  <path class="line dash" d="M950 372 V302"/>
  <text x="962" y="343" class="label start">one link</text>
  <path class="line" d="M1170 205 H1082"/>
  <text x="1126" y="172" class="label">read, quote,</text>
  <text x="1126" y="194" class="label">book</text>
  <path class="line" d="M1257 256 V417 H1082"/>
  <text x="1170" y="407" class="label">read</text>

  <!-- People -->
  <rect x="20" y="170" width="190" height="76" rx="38" fill="#1F1E18" stroke="#ECEBE4" stroke-width="1.5"/>
  <text x="115" y="215" class="name" fill="#ECEBE4" style="font-size:20px">Business owner</text>
  <rect x="1170" y="158" width="175" height="98" rx="49" fill="#1F1E18" stroke="#ECEBE4" stroke-width="1.5"/>
  <text x="1257" y="202" class="name" fill="#ECEBE4" style="font-size:21px">AI agents</text>
  <text x="1257" y="228" class="sub" fill="#ECEBE4">like Muse</text>

  <!-- Legible -->
  <rect x="340" y="110" width="320" height="190" rx="10" fill="#3A2418" stroke="#F0814A" stroke-width="2"/>
  <text x="500" y="160" class="name" fill="#FCE9DD" style="font-size:27px">Legible</text>
  <text x="500" y="190" class="sub" fill="#FCE9DD" style="font-weight:600">agentic harness</text>
  <text x="500" y="228" class="sub" fill="#FCE9DD">crawls, extracts, interviews,</text>
  <text x="500" y="254" class="sub" fill="#FCE9DD">reviews agent traces</text>

  <rect x="340" y="14" width="320" height="60" rx="8" fill="#2A2922" stroke="#A3A097" stroke-width="1.5" stroke-dasharray="6 5"/>
  <text x="500" y="51" class="sub" fill="#ECEBE4" style="font-weight:600">Muse Spark and Exa</text>

  <rect x="340" y="372" width="320" height="90" rx="10" fill="#2A2350" stroke="#A99BF0" stroke-width="2"/>
  <text x="500" y="411" class="name" fill="#EDEAFF">Errand</text>
  <text x="500" y="439" class="sub" fill="#EDEAFF">simulated customer agents</text>

  <!-- Public page -->
  <rect x="820" y="110" width="260" height="190" rx="10" fill="#14304D" stroke="#6FB0F0" stroke-width="2"/>
  <text x="950" y="160" class="name" fill="#E3F0FF" style="font-size:25px">Public page</text>
  <text x="950" y="190" class="sub" fill="#E3F0FF" style="font-weight:600">Cloudflare Worker + D1</text>
  <text x="950" y="228" class="sub" fill="#E3F0FF">facts, quotes,</text>
  <text x="950" y="254" class="sub" fill="#E3F0FF">questions, bookings</text>

  <rect x="820" y="372" width="260" height="90" rx="10" fill="#2A2922" stroke="#A3A097" stroke-width="1.5" stroke-dasharray="6 5"/>
  <text x="950" y="411" class="name" fill="#ECEBE4" style="font-size:21px">Business website</text>
  <text x="950" y="439" class="sub" fill="#ECEBE4">+ one link line</text>
</svg>
