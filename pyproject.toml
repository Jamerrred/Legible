[project]
name = "musefront"
version = "0.1.0"
description = "MuseFront first demo: mock detailing site, agent resource, consumer agent and benchmark"
requires-python = ">=3.12,<3.13"
dependencies = [
    "beautifulsoup4>=4.15.0",
    "browser-use>=0.13.14",
    "composio>=0.18.0",
    "fastapi>=0.162.0",
    "httpx>=0.28.1",
    "jinja2>=3.1.6",
    "pillow>=12.3.0",
    "python-dotenv>=1.2.2",
    "python-multipart>=0.0.33",
    "uvicorn[standard]>=0.54.0",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 140
target-version = "py312"
# consumer_agent/ stays byte-identical to the tag first-demo-agent-freeze, so the benchmark's
# remaining runs use the same agent. Lint it only when the agent is deliberately changed.
extend-exclude = ["consumer_agent", "research_notes"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.per-file-ignores]
# These hold long runs of page text, where wrapping would hurt more than it helps.
"demo_resource/*" = ["E501"]
# Model prompts are long lines of plain text.
"back_office/*" = ["E501"]
"scripts/mvp_demo.py" = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "ruff>=0.17.3",
]
